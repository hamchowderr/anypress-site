name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # Vercel builds this site on Node 24 (project setting).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
